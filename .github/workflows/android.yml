name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "## Android build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,260p' build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when APK build fails
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: primal-crafting-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add APK to job summary
        run: |
          echo "## PRIMAL APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Debug APK artifact: **primal-crafting-debug-apk**" >> "$GITHUB_STEP_SUMMARY"
