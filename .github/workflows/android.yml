name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify both story endings and saves
        run: |
          mkdir -p build/story-tests
          javac -encoding UTF-8 -d build/story-tests app/src/main/java/com/enisyergok/primalcrafting/GameState.java tests/GameStateTest.java
          java -cp build/story-tests GameStateTest

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 35 responsive UI and persistence smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tests/device-smoke.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: primal-crafting-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload device screenshots
        uses: actions/upload-artifact@v4
        with:
          name: primal-device-screenshots
          path: build/screenshots
          if-no-files-found: error

      - name: Add APK to job summary
        run: |
          echo "## PRIMAL APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Debug APK artifact: **primal-crafting-debug-apk**" >> "$GITHUB_STEP_SUMMARY"
